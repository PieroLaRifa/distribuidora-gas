services:
  mysql:
    image: mysql:8.4
    container_name: elvolcan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_2026
      MYSQL_DATABASE: elvolcan
      MYSQL_USER: elvolcan_user
      MYSQL_PASSWORD: elvolcan_dev_2026
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: